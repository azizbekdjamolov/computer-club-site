databases:
  - name: computer-club-db
    databaseName: computer_club
    user: computer_club_user
    plan: free

services:
  - type: web
    name: computer-club
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 90"
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: computer-club-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_TIME_ZONE
        value: "Asia/Tashkent"
      - key: PYTHON_VERSION
        value: "3.13"