{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CYBER CLUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
</head>
<body class="auth-body">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark"><i data-lucide="gamepad-2"></i></span>
                <h1>Cyber Club</h1>
                <p>Management System</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-error" style="margin-bottom:16px;">
                <i data-lucide="triangle-alert"></i> Login yoki parol noto'g'ri
            </div>
            {% endif %}

            <form method="post" class="auth-form" autocomplete="off">
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div class="form-group">
                    <label><i data-lucide="user"></i> Username</label>
                    <input type="text" name="username" class="form-control" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label><i data-lucide="lock"></i> Password</label>
                    <input type="password" name="password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:6px;">
                    <i data-lucide="log-in"></i> Login
                </button>
            </form>

            <div class="auth-foot">
                <i data-lucide="shield-check"></i> Secure access · Club operations only
            </div>
        </div>
    </div>
    <script>
        if (window.lucide) { window.lucide.createIcons(); }
    </script>
</body>
</html>
